name: Email Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r email_mcp_app/requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests, code quality, SAST, secret and dependency scans
        run: python scripts/check_quality.py
